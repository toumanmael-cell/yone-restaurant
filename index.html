function normaliser(texte) {
  return String(texte || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, " ")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}


function ajouterMessage(message, type = "yone") {
  const chat = document.getElementById("chat");

  if (!chat) return;

  const div = document.createElement("div");

  div.className = "message " + type;

  div.innerHTML = message;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


function envoyerRapide(message) {
  const input = document.getElementById("messageInput");

  if (!input) return;

  input.value = message;

  envoyer();
}


function envoyer() {
  const input = document.getElementById("messageInput");

  if (!input) return;

  const texte = input.value.trim();

  if (!texte) return;

  ajouterMessage(texte, "client");

  input.value = "";

  traiterMessage(texte);
}


/* =========================================================
   QUANTITÉ
========================================================= */

function trouverQuantite(texte) {
  const t = normaliser(texte);

  const correspondance = t.match(
    /\b(\d+)\b/
  );

  if (correspondance) {
    const nombre = parseInt(correspondance[1], 10);

    if (nombre > 0 && nombre <= 50) {
      return nombre;
    }
  }

  const nombres = {
    un: 1,
    une: 1,
    deux: 2,
    trois: 3,
    quatre: 4,
    cinq: 5,
    six: 6,
    sept: 7,
    huit: 8,
    neuf: 9,
    dix: 10
  };

  for (const mot in nombres) {
    if (t.split(" ").includes(mot)) {
      return nombres[mot];
    }
  }

  return 1;
}


/* =========================================================
   RECHERCHE PRODUIT
========================================================= */

function trouverProduit(texte) {
  const t = normaliser(texte);

  /*
    On retire les mots qui ne servent pas
    à identifier le produit.
  */

  const nettoye = t
    .replace(/\bje\b/g, " ")
    .replace(/\bvoudrais\b/g, " ")
    .replace(/\bveux\b/g, " ")
    .replace(/\bveut\b/g, " ")
    .replace(/\bprendre\b/g, " ")
    .replace(/\bprends\b/g, " ")
    .replace(/\bajoute\b/g, " ")
    .replace(/\bajouter\b/g, " ")
    .replace(/\bcommande\b/g, " ")
    .replace(/\bcommander\b/g, " ")
    .replace(/\bs il te plait\b/g, " ")
    .replace(/\bs il vous plait\b/g, " ")
    .replace(/\bsvp\b/g, " ")
    .replace(/\bmerci\b/g, " ")
    .replace(/\b\d+\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  /*
    Recherche exacte ou très proche.
  */

  let produit = menu.find(item => {
    return normaliser(item.nom) === nettoye;
  });

  if (produit) {
    return produit;
  }

  /*
    Recherche par contenu.
  */

  const candidats = menu.filter(item => {
    const nom = normaliser(item.nom);

    return (
      nom.length >= 4 &&
      (
        nettoye.includes(nom) ||
        nom.includes(nettoye)
      )
    );
  });

  /*
    Si plusieurs produits sont possibles,
    on privilégie le produit dont le nom
    contient le plus de mots communs.
  */

  if (candidats.length > 0) {

    const motsRecherche = nettoye.split(" ");

    candidats.sort((a, b) => {

      const motsA = normaliser(a.nom).split(" ");
      const motsB = normaliser(b.nom).split(" ");

      const scoreA = motsRecherche.filter(
        mot => motsA.includes(mot)
      ).length;

      const scoreB = motsRecherche.filter(
        mot => motsB.includes(mot)
      ).length;

      return scoreB - scoreA;
    });

    return candidats[0];
  }

  return null;
}


/* =========================================================
   TOTAL
========================================================= */

function calculerTotal() {
  return panier.reduce((total, item) => {

    const prix = item.prixChoisi || item.prix;

    return total + prix;

  }, 0);
}


/* =========================================================
   AJOUT AU PANIER
========================================================= */

function ajouterAuPanier(produit, quantite = 1) {

  /*
    Les produits avec deux tailles
    passent d'abord par le choix M/L.
  */

  if (produit.prixL) {

    produitEnAttente = produit;
    quantiteEnAttente = quantite;

    etape = "taille";

    ajouterMessage(
      `Pour <b>${produit.nom}</b>, choisissez votre taille :<br><br>` +
      `🔹 <b>M</b> — ${produit.prix} DH<br>` +
      `🔹 <b>L</b> — ${produit.prixL} DH`
    );

    return;
  }


  for (let i = 0; i < quantite; i++) {

    panier.push({
      nom: produit.nom,
      categorie: produit.categorie,
      prix: produit.prix,
      prixChoisi: produit.prix,
      taille: ""
    });
  }


  const sousTotal = produit.prix * quantite;


  ajouterMessage(
    `✅ <b>${quantite} × ${produit.nom}</b> ajouté à votre commande.<br>` +
    `Prix : <b>${sousTotal} DH</b>`
  );


  ajouterMessage(
    `🛒 Total actuel : <b>${calculerTotal()} DH</b><br><br>` +
    `Vous pouvez ajouter autre chose ou dire <b>« ma commande »</b>.`
  );
}


/* =========================================================
   CHOIX DE TAILLE
========================================================= */

function choisirTaille(taille) {

  if (!produitEnAttente) return;

  let prix;

  if (taille === "L") {
    prix = produitEnAttente.prixL;
  } else {
    prix = produitEnAttente.prix;
    taille = "M";
  }


  for (let i = 0; i < quantiteEnAttente; i++) {

    panier.push({
      nom: produitEnAttente.nom,
      categorie: produitEnAttente.categorie,
      prix: prix,
      prixChoisi: prix,
      taille: taille
    });
  }


  const totalAjout =
    prix * quantiteEnAttente;


  ajouterMessage(
    `✅ <b>${quantiteEnAttente} × ${produitEnAttente.nom}</b> ` +
    `(${taille}) ajouté.<br>` +
    `Prix : <b>${totalAjout} DH</b>`
  );


  produitEnAttente = null;
  quantiteEnAttente = 1;
  etape = "commande";


  ajouterMessage(
    `🛒 Total actuel : <b>${calculerTotal()} DH</b><br><br>` +
    `Vous pouvez continuer votre commande 😊`
  );
}

/* =========================================================

========================================================= */

function chercherCategorie(texte) {

  const t = normaliser(texte);


  if (
    t === "menu" ||
    t.includes("voir le menu") ||
    t.includes("montre le menu") ||
    t.includes("affiche le menu") ||
    t.includes("quel est le menu")
  ) {
    return "menu";
  }


  for (let i = 0; i < categories.length; i++) {

    const categorie = categories[i];

    if (
      categorie.mots.some(mot =>
        t.includes(normaliser(mot))
      )
    ) {
      return i;
    }
  }


  return null;
}

  panier = [];

  client = {
    nom: "",
    telephone: "",

  };

  produitEnAttente = null;
  quantiteEnAttente = 1;

  etape = "commande";


  ajouterMessage(

    "Que souhaitez-vous commander ?"
  );

/* =========================================================
   DÉTECTION NOUVELLE COMMANDE
========================================================= */

function estNouvelleCommande(texte) {

  const t = normaliser(texte);


  return (
    t.includes("nouvelle commande") ||
    t.includes("recommencer") ||
    t.includes("recommence") ||
    t.includes("autre commande") ||
    t.includes("nouvel commande")
  );
}


/* =========================================================
   TRAITEMENT PRINCIPAL
========================================================= */

function traiterMessage(texte) {

  const original = texte.trim();

  const t = normaliser(original);


  if (!original) return;


  /* -----------------------------------------
     NOUVELLE COMMANDE
  ----------------------------------------- */

  if (estNouvelleCommande(original)) {

    nouvelleCommande();

    return;
  }


  /* -----------------------------------------
     SI UNE COMMANDE ÉTAIT TERMINÉE
  ----------------------------------------- */

  if (etape === "termine") {

    nouvelleCommande();

    /*
      On traite également le nouveau message.
      Exemple :
      "Je voudrais 1 Pad thai"
    */

    traiterMessage(original);

    return;
  }


  /* -----------------------------------------
     MENU
  ----------------------------------------- */

  const categorieDemandee =
    chercherCategorie(original);


  if (categorieDemandee === "menu") {

    afficherMenu();

    return;
  }


  if (
    categorieDemandee !== null &&
    typeof categorieDemandee === "number"
  ) {

    afficherProduitsCategorie(
      categorieDemandee
    );

    return;
  }


  /* -----------------------------------------
     PANIER
  ----------------------------------------- */

  if (
    t.includes("ma commande") ||
    t.includes("mon panier") ||
    t.includes("voir mon panier") ||
    t.includes("voir la commande") ||
    t.includes("recap") ||
    t.includes("récap")
  ) {

    afficherCommande();

    return;
  }


  /* -----------------------------------------
     CHOIX M / L
  ----------------------------------------- */

  if (etape === "taille") {

    if (
      t === "m" ||
      t === "taille m" ||
      t.includes("moyenne")
    ) {

      choisirTaille("M");

      return;
    }


    if (
      t === "l" ||
      t === "taille l" ||
      t.includes("grande")
    ) {

      choisirTaille("L");

      return;
    }


    ajouterMessage(
      "Veuillez choisir une taille :<br><br>" +
      "👉 <b>M</b><br>" +
      "👉 <b>L</b>"
    );

    return;
  }


  /* -----------------------------------------
     NOM
  ----------------------------------------- */

  if (etape === "nom") {

    client.nom = original;

    etape = "telephone";


    ajouterMessage(
      `Merci <b>${client.nom}</b> 😊<br><br>` +
      "Quel est votre <b>numéro de téléphone</b> ?"
    );

    return;
  }


  /* -----------------------------------------
     TÉLÉPHONE
  ----------------------------------------- */

  if (etape === "telephone") {

    const telephone =
      original.replace(/[^\d+]/g, "");


    if (telephone.length < 8) {

      ajouterMessage(
        "📱 Veuillez entrer un numéro de téléphone valide."
      );

      return;
    }


    client.telephone = original;

    etape = "adresse";


    ajouterMessage(
      "Merci 📱<br><br>" +
      "Quelle est votre <b>adresse de livraison</b> ?"
    );

    return;
  }


  /* -----------------------------------------
     ADRESSE
  ----------------------------------------- */

  if (etape === "adresse") {

    if (original.length < 5) {

      ajouterMessage(
        "📍 Pouvez-vous préciser votre adresse de livraison ?"
      );

      return;
    }


    client.adresse = original;

    etape = "confirmation";


    afficherCommande();


    ajouterMessage(
      `👤 <b>Nom :</b> ${client.nom}<br>` +
      `📱 <b>Téléphone :</b> ${client.telephone}<br>` +
      `📍 <b>Adresse :</b> ${client.adresse}<br><br>` +

      "<b>Confirmez-vous cette commande ?</b><br><br>" +

      "👉 Répondez <b>Oui</b> pour confirmer.<br>" +
      "👉 Répondez <b>Non</b> pour modifier."
    );

    return;
  }


  /* -----------------------------------------
     CONFIRMATION
  ----------------------------------------- */

  if (etape === "confirmation") {

    if (
      t === "oui" ||
      t === "ok" ||
      t === "confirme" ||
      t === "confirmer" ||
      t.includes("je confirme")
    ) {

      envoyerCommandeWhatsApp();

      return;
    }


    if (
      t === "non" ||
      t.includes("modifier") ||
      t.includes("changer")
    ) {

      etape = "commande";


      ajouterMessage(
        "Pas de problème 😊<br><br>" +
        "Que souhaitez-vous modifier ou ajouter ?"
      );

      return;
    }


    ajouterMessage(
      "Répondez simplement <b>Oui</b> ou <b>Non</b> 😊"
    );

    return;
  }


  /* -----------------------------------------
     TERMINER LA COMMANDE
  ----------------------------------------- */

  if (
    t === "c est tout" ||
    t.includes("c'est tout") ||
    t.includes("terminer") ||
    t.includes("finaliser") ||
    t.includes("je termine") ||
    t.includes("finir la commande")
  ) {

    if (panier.length === 0) {

      ajouterMessage(
        "Votre panier est encore vide 😊"
      );

      return;
    }


    etape = "nom";


    ajouterMessage(
      "Parfait 👍 Votre commande est prête.<br><br>" +
      "Quel est votre <b>nom</b> ?"
    );

    return;
  }


  /* -----------------------------------------
     PRODUIT
  ----------------------------------------- */

  const produit = trouverProduit(original);


  if (produit) {

    const quantite =
      trouverQuantite(original);


    ajouterAuPanier(
      produit,
      quantite
    );

    return;
  }


  /* -----------------------------------------
     OUI DANS UNE COMMANDE NORMALE
  ----------------------------------------- */

  if (
    t === "oui" ||
    t === "ok" ||
    t === "daccord" ||
    t === "d accord"
  ) {

    ajouterMessage(
      "Parfait 😊 Que souhaitez-vous ajouter à votre commande ?"
    );

    return;
  }


  /* -----------------------------------------
     MESSAGE NON COMPRIS
  ----------------------------------------- */

  ajouterMessage(
    "Je n'ai pas bien compris 😅<br><br>" +

    "Vous pouvez par exemple écrire :<br><br>" +

    "🍣 <b>Je voudrais 2 Maki Saumon</b><br>" +
    "🍜 <b>Je voudrais 1 Pad thai</b><br>" +
    "🥤 <b>Ajoute 2 Soda</b><br>" +
    "📋 <b>Menu</b><br>" +
    "🛒 <b>Ma commande</b>"
  );
  }

function creerMessageWhatsApp() {

  let message = "🍣 *NOUVELLE COMMANDE YONE* 🍣\n\n";

  message += "👤 *Client :* " + client.nom + "\n";
  message += "📱 *Téléphone :* " + client.telephone + "\n";
  message += "📍 *Adresse :* " + client.adresse + "\n\n";

  message += "🛒 *COMMANDE :*\n";

  panier.forEach((item, index) => {

    const taille = item.taille
      ? " (" + item.taille + ")"
      : "";

    message +=
      `${index + 1}. ${item.nom}${taille} — ${item.prixChoisi} DH\n`;
  });

  message += "\n💰 *TOTAL : " + calculerTotal() + " DH*";

  return message;
}


/* =========================================================
   ENVOYER LA COMMANDE SUR WHATSAPP
========================================================= */

function envoyerCommandeWhatsApp() {

  if (panier.length === 0) {

    ajouterMessage(
      "🛒 Votre commande est vide."
    );

    return;
  }

  const message =
    creerMessageWhatsApp();

  const url =
    `https://wa.me/${whatsappRestaurant}?text=${encodeURIComponent(message)}`;

  ajouterMessage(
    "✅ <b>Commande confirmée !</b><br><br>" +
    "Votre commande va maintenant être envoyée au restaurant sur WhatsApp. 📲<br><br>" +
    "Merci d'avoir choisi <b>YONE</b> 🍣❤️"
  );

  etape = "termine";

  setTimeout(() => {

    window.location.href = url;

  }, 1200);
}
