      max-width: 90%;

    .yone {

      margin-right: auto;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
      position: sticky;
      bottom: 0;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    .total {
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
