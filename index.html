/* =========================================================
   OUTILS
========================================================= */

function normaliser(texte) {
  return texte
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, "'")
    .trim();
}


function ajouterMessage(texte, type = "yone") {

  const chat = document.getElementById("chat");

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = texte;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


function trouverQuantite(texte) {

  const chiffres = texte.match(/\b([1-9]|10)\b/);

  if (chiffres) {
    return parseInt(chiffres[1]);
  }

  const nombres = {
    "un":1,
    "une":1,
    "deux":2,
    "trois":3,
    "quatre":4,
    "cinq":5,
    "six":6,
    "sept":7,
    "huit":8,
    "neuf":9,
    "dix":10
  };

  const mots = normaliser(texte).split(/\s+/);

  for (const mot of mots) {
    if (nombres[mot]) {
      return nombres[mot];
    }
  }

  return 1;
}


/* =========================================================
   RECHERCHE PRODUIT
========================================================= */

function trouverProduit(texte) {

  const t = normaliser(texte);

  let produits = [...menu];

  /*
    On essaie d'abord les noms les plus longs.
    Cela évite par exemple que "maki saumon"
    soit trouvé avant une expression plus précise.
  */

  produits.sort((a,b) =>
    normaliser(b.nom).length - normaliser(a.nom).length
  );

  for (const produit of produits) {

    const nom = normaliser(produit.nom);

    if (t.includes(nom)) {
      return produit;
    }
  }

  /*
    Quelques raccourcis naturels
  */

  const correspondances = [
    ["maki saumon", "maki saumon"],
    ["saumon maki", "maki saumon"],
    ["maki ebi", "maki ebi"],
    ["soda", "soda 33cl"],
    ["eau", "eau minérale 50cl"],
    ["pad thai", "pad thai"],
    ["poulet noix de cajou", "poulet noix de cajou"],
    ["chicken yasashii", "chicken yasashii"]
  ];

  for (const [mot, produitNom] of correspondances) {

    if (t.includes(normaliser(mot))) {

      return menu.find(
        p => normaliser(p.nom) === normaliser(produitNom)
      );
    }
  }

  return null;
}


/* =========================================================
   PANIER
========================================================= */

function afficherCommande() {

  if (commande.length === 0) {
    return "Votre panier est vide.";
  }

  let texte = "🧾 Votre commande :\n\n";

  let total = 0;

  commande.forEach(item => {

    const sousTotal = item.prix * item.quantite;

    total += sousTotal;

    texte +=
      "🍽️ " +
      item.quantite +
      " × " +
      item.nom +
      " — " +
      sousTotal +
      " DH\n";
  });

  texte += "\n💰 Total : " + total + " DH";

  return texte;
}


function calculerTotal() {

  return commande.reduce(
    (total, item) =>
      total + item.prix * item.quantite,
    0
  );
}


/* =========================================================
   MESSAGE WHATSAPP
========================================================= */

function creerMessageWhatsApp() {

  let message = "🍽️ NOUVELLE COMMANDE YONE\n\n";

  commande.forEach(item => {

    message +=
      item.quantite +
      " × " +
      item.nom +
      " — " +
      (item.prix * item.quantite) +
      " DH\n";
  });

  message += "\n💰 TOTAL : " + calculerTotal() + " DH\n\n";

  message += "👤 CLIENT : " + client.nom + "\n";
  message += "📱 TÉLÉPHONE : " + client.telephone + "\n";
  message += "📍 ADRESSE : " + client.adresse + "\n\n";

  message += "✅ Commande confirmée depuis Yone.";

  return message;
}


/* =========================================================
   ENVOI DU MESSAGE
========================================================= */

function envoyer() {

  const input = document.getElementById("messageInput");

  const texte = input.value.trim();

  if (!texte) return;

  ajouterMessage(texte, "user");

  input.value = "";

  traiterMessage(texte);
}


/* =========================================================
   LOGIQUE PRINCIPALE
========================================================= */

function traiterMessage(texte) {

  /* -------------------------
     ÉTAPE COMMANDE
  ------------------------- */

  if (etape === "commande") {

    const produit = trouverProduit(texte);

    if (!produit) {

      ajouterMessage(
        "Je n'ai pas trouvé ce produit dans le menu 😕\n\n" +
        "Vous pouvez me donner le nom du plat ou de la boisson que vous souhaitez commander."
      );

      return;
    }

    const quantite = trouverQuantite(texte);

    commande.push({
      nom: produit.nom,
      prix: produit.prix,
      quantite: quantite
    });

    ajouterMessage(
      "Excellent choix 😋\n\n" +
      "🍽️ " +
      quantite +
      " × " +
      produit.nom +
      " — " +
      (produit.prix * quantite) +
      " DH\n\n" +
      "Souhaitez-vous ajouter autre chose ?"
    );

    etape = "ajouter";

    return;
  }


  /* -------------------------
     ÉTAPE AJOUT
  ------------------------- */

  if (etape === "ajouter") {

    const t = normaliser(texte);

    if (
      t.includes("non") ||
      t.includes("c'est tout") ||
      t.includes("c est tout") ||
      t.includes("rien") ||
      t.includes("terminer") ||
      t.includes("fini")
    ) {

      ajouterMessage(
        afficherCommande() +
        "\n\n👤 Pour continuer, indiquez votre nom."
      );

      etape = "nom";

      return;
    }

    const produit = trouverProduit(texte);

    if (produit) {

      const quantite = trouverQuantite(texte);

      commande.push({
        nom: produit.nom,
        prix: produit.prix,
        quantite: quantite
      });

      ajouterMessage(
        "Ajouté 👍\n\n" +
        afficherCommande() +
        "\n\nSouhaitez-vous ajouter autre chose ?"
      );

      return;
    }

    ajouterMessage(
      "Je n'ai pas trouvé ce produit 😕\n" +
      "Vous pouvez essayer avec le nom exact du plat ou de la boisson."
    );

    return;
  }


  /* -------------------------
     ÉTAPE NOM
  ------------------------- */

  if (etape === "nom") {

    client.nom = texte;

    ajouterMessage(
      "Merci " +
      client.nom +
      " 😊\n\n" +
      "Quel est votre numéro de téléphone ?"
    );

    etape = "telephone";

    return;
  }


  /* -------------------------
     ÉTAPE TELEPHONE
  ------------------------- */

  if (etape === "telephone") {

    client.telephone = texte;

    ajouterMessage(
      "Parfait 📱\n\n" +
      "Quelle est votre adresse de livraison ?"
    );

    etape = "adresse";

    return;
  }


  /* -------------------------
     ÉTAPE ADRESSE
  ------------------------- */

  if (etape === "adresse") {

    client.adresse = texte;

    ajouterMessage(
      "Merci 📍\n\n" +
      afficherCommande() +
      "\n\n" +
      "👤 Nom : " + client.nom +
      "\n📱 Téléphone : " + client.telephone +
      "\n📍 Adresse : " + client.adresse +
      "\n\n" +
      "Souhaitez-vous confirmer cette commande ?"
    );

    etape = "confirmation";

    return;
  }


  /* -------------------------
     ÉTAPE CONFIRMATION
  ------------------------- */

  if (etape === "confirmation") {

    const t = normaliser(texte);

    if (
      t === "oui" ||
      t.includes("confirme") ||
      t.includes("je confirme") ||
      t.includes("c'est bon") ||
      t.includes("c est bon")
    ) {

      ajouterMessage(
        "🎉 Commande confirmée !\n\n" +
        "Merci d'avoir choisi Yone Restaurant ❤️\n\n" +
        "Notre équipe va traiter votre commande."
      );

      const messageWhatsApp =
        encodeURIComponent(creerMessageWhatsApp());

      const lienWhatsApp =
        "https://wa.me/" +
        whatsappRestaurant +
        "?text=" +
        messageWhatsApp;

      /*
        Redirection directe vers WhatsApp.
        Cette méthode fonctionne mieux sur mobile
        que window.open().
      */

      setTimeout(() => {

        window.location.href = lienWhatsApp;

      }, 500);

      etape = "termine";

      return;
    }

    if (
      t === "non" ||
      t.includes("annule") ||
      t.includes("annuler")
    ) {

      ajouterMessage(
        "D'accord 👍 Votre commande n'a pas été envoyée."
      );

      etape = "termine";

      return;
    }

    ajouterMessage(
      "Souhaitez-vous confirmer la commande ? 😊\n\n" +
      "Répondez simplement « Oui » ou « Non »."
    );

    return;
  }


  /* -------------------------
     FIN
  ------------------------- */

  if (etape === "termine") {

    ajouterMessage(
      "Cette commande est terminée 😊"
    );

  }

}


/* =========================================================
   MESSAGE D'ACCUEIL
========================================================= */

ajouterMessage(
  "Bonjour 👋 Je suis Yone.\n\n" +
  "Je peux vous aider à passer votre commande chez Yone Restaurant 🍣\n\n" +
  "Que souhaitez-vous commander aujourd'hui ?"
);


/* =========================================================
   TOUCHE ENTRÉE
========================================================= */

document
  .getElementById("messageInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      envoyer();
    }

  });

</script>
