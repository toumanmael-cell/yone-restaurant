    }

    body {
      margin: 0;

      color: #222;
    }

    .app {

      display: flex;

    }

    }

    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #fafafa;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 15px;
      white-space: pre-line;
      line-height: 1.45;
    }

    .yone {
      background: #eeeeee;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .client {
      background: #111;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .quick-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-top: 1px solid #eee;
      background: white;
    }

    .quick-actions button {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 12px 15px;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      background: #111;
      color: white;
      border-radius: 22px;
      padding: 0 18px;
      cursor: pointer;
    }

    .menu-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      margin: 7px 0;
    }

    .menu-name {

    }

    .menu-price {
      color: #555;
      margin-top: 3px;
    }

    .category-title {
      font-weight: bold;
      margin-top: 12px;
      font-size: 17px;
    }
  </style>
</head>

  ========================================================= */

  let panier = [];

  };

  /* =========================================================
     OUTILS
  ========================================================= */

  function normaliser(texte) {
    return texte
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }


  function ajouterMessage(message, type = "yone") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = message;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
  }


  function envoyerRapide(message) {

    document.getElementById("messageInput").value = message;

    envoyer();
  }


  function envoyer() {

    const input = document.getElementById("messageInput");

    const texte = input.value.trim();

    if (!texte) return;

    ajouterMessage(texte, "client");

    input.value = "";

    traiterMessage(texte);
  }


  function trouverQuantite(texte) {

    const match = normaliser(texte).match(
      /\b(\d+)\b/
    );

    if (!match) return 1;

    const nombre = parseInt(match[1]);

    if (nombre < 1) return 1;

    if (nombre > 50) return 50;

    return nombre;
  }


  function trouverProduit(texte) {

    const recherche = normaliser(texte);

    let meilleur = null;

    let meilleurScore = 0;

    for (const produit of menu) {

      const nom = normaliser(produit.nom);

      if (
        recherche === nom ||
        recherche.includes(nom) ||
        nom.includes(recherche)
      ) {

        let score = nom.length;

        if (recherche.includes(nom)) {
          score += 100;
        }

        if (score > meilleurScore) {
          meilleur = produit;
          meilleurScore = score;
        }
      }
    }

    /* Quelques recherches naturelles */

    const alias = [

      ["pad thai", "Pad thai"],
      ["maki saumon", "Maki Saumon"],
      ["maki thon", "Maki Thon"],
      ["maki avocat", "Maki Avocat"],
      ["maki crevette", "Maki Ebi"],
      ["maki ebi", "Maki Ebi"],
      ["soda", "Soda 33cl"],
      ["eau", "Eau minérale 50cl"],
      ["burger saumon", "S.Burger Saumon"],
      ["burger thon", "S.Burger Thon"],
      ["bao fusion", "Bao Fusion"],
      ["bao latino", "Bao Latino"],
      ["tartare saumon", "Tartare Saumon"],
      ["poke yone", "Yone Poké"],
      ["poke deluxe", "Deluxe Poké"]
    ];


    for (const [mot, nomProduit] of alias) {

      if (recherche.includes(normaliser(mot))) {

        const produit = menu.find(
          p => normaliser(p.nom) === normaliser(nomProduit)
        );

        if (produit) return produit;
      }
    }

    return meilleur;
  }


  function calculerTotal() {

    return panier.reduce(
      (total, article) =>
        total + article.prix * article.quantite,
      0
    );
  }


  function afficherCommande() {

    if (panier.length === 0) {

      return "Votre panier est actuellement vide 🛒";
    }

    let texte = "🛒 Votre commande :\n\n";

    panier.forEach((article, index) => {

      texte +=
        (index + 1) +
        ". " +
        article.quantite +
        " × " +
        article.nom +
        " — " +

  function afficherCategorie(categorie) {
    const correspondances = {
      sushi: [
        "Signature",
        "Aromaki",
        "California",
        "Fresh Roll",
        "Maki",
        "Nigiri",
        "Fried Sushi",
        "Maki Fry",
        "Taco Sushi",
        "Pizza Sushi",
        "Onigiri",
        "Assortiments"
      ],
      poke: ["Poké Bowl"],
      boissons: ["Boissons"],
      desserts: ["Desserts"],
      salades: ["Salades"],
      soupes: ["Soupes", "Yakitori"],
      burgers: ["Burgers", "Bao bun", "Taco Yone"],
      wok: ["Wok & Riz cantonais"],
      chef: ["Plats du chef"],
      formules: ["Bento", "Formules midi"],
      sashimi: ["Sashimi & Co"]
    };

    const mots = correspondances[categorie];

    if (!mots) {
      ajouterMessage(
        "Je n’ai pas trouvé cette catégorie 😅<br><br>" +
        "Essayez <b>Menu</b> pour voir toutes les catégories."
      );
      return;
    }

    let produits = [];

    menu.forEach(item => {
      const cat = normaliser(item.categorie || "");

      mots.forEach(mot => {
        if (cat.includes(normaliser(mot))) {
          produits.push(item);
        }
      });
    });

    // Supprimer les doublons
    produits = produits.filter(
      (item, index, self) =>
        index === self.findIndex(
          x => x.nom === item.nom && x.categorie === item.categorie
        )
    );

    if (produits.length === 0) {
      ajouterMessage(
        "Cette catégorie est en cours de préparation 😊"
      );
      return;
    }

    let html = `<div class="menu-titre">🍣 ${categorie.toUpperCase()}</div>`;

    produits.forEach(item => {
      let prix = item.prix + " DH";

      if (item.prixL) {
        prix += ` / L ${item.prixL} DH`;
      }

      html += `
        <div class="produit-menu">
          <b>${item.nom}</b>
          <span>${prix}</span>
        </div>
      `;
    });

    html += `
      <br>
      <button onclick="envoyerRapide('Ma commande')">
        🛒 Voir ma commande
      </button>
    `;

    ajouterMessage(html);
  }

  function trouverProduitIntelligent(texte) {
    const t = normaliser(texte);

    // Recherche exacte en priorité
    let exact = menu.find(item => {
      return normaliser(item.nom) === t;
    });

    if (exact) return exact;

    // Recherche par nom contenu dans la phrase
    let trouves = menu.filter(item => {
      const nom = normaliser(item.nom);
      return nom.length >= 3 && t.includes(nom);
    });

    if (trouves.length === 1) {
      return trouves[0];
    }

    // Recherche inverse : le nom demandé peut contenir le texte
    if (trouves.length === 0) {
      trouves = menu.filter(item => {
        const nom = normaliser(item.nom);
        return nom.length >= 4 && nom.includes(t);
      });
    }

    // Éviter une mauvaise sélection lorsque "Yone" est ambigu
    if (trouves.length > 1) {
      return null;
    }

    return trouves[0] || null;
  }

  function demanderTaille(produit, quantite) {
    produitEnAttente = produit;
    quantiteEnAttente = quantite;
    etape = "taille";

    ajouterMessage(
      `Pour <b>${produit.nom}</b>, choisissez la taille :<br><br>` +
      `👉 <b>M</b> : ${produit.prix} DH<br>` +
      `👉 <b>L</b> : ${produit.prixL} DH`
    );
  }

  function ajouterProduitAvecTaille(taille) {
    if (!produitEnAttente) return;

    const produit = {...produitEnAttente};

    if (taille === "L") {
      produit.prixChoisi = produit.prixL;
      produit.taille = "L";
    } else {
      produit.prixChoisi = produit.prix;
      produit.taille = "M";
    }

    for (let i = 0; i < quantiteEnAttente; i++) {
      panier.push(produit);
    }

    ajouterMessage(
      `✅ ${quantiteEnAttente} × <b>${produit.nom}</b> ` +
      `(${produit.taille}) ajouté à votre commande.<br>` +
      `Prix : <b>${produit.prixChoisi * quantiteEnAttente} DH</b>`
    );

    produitEnAttente = null;
    quantiteEnAttente = 1;
    etape = "commande";

    ajouterMessage(
      `Souhaitez-vous ajouter autre chose ? 😊<br><br>` +
      `Vous pouvez dire <b>« ma commande »</b> pour voir le récapitulatif.`
    );
  }

  function commencerNouvelleCommande() {
    panier = [];
    client = {
      nom: "",
      telephone: "",
      adresse: ""
    };

    produitEnAttente = null;
    quantiteEnAttente = 1;
    etape = "commande";

    ajouterMessage(
      "🔄 Très bien ! On commence une nouvelle commande.<br><br>" +
      "Que souhaitez-vous commander ? 😊"
    );
  }

  function creerMessageWhatsApp() {
    let message = "Bonjour YONE 👋%0A%0A";
    message += "*Nouvelle commande* 🍣%0A%0A";

    panier.forEach((item, index) => {
      const prix = item.prixChoisi || item.prix;
      const taille = item.taille ? ` (${item.taille})` : "";

      message += `${index + 1}. ${item.nom}${taille} — ${prix} DH%0A`;
    });

    message += `%0A*Total : ${calculerTotal()} DH*%0A%0A`;

    message += `*Client :* ${client.nom}%0A`;
    message += `*Téléphone :* ${client.telephone}%0A`;
    message += `*Adresse :* ${client.adresse}%0A`;

    return message;
  }

  function terminerCommande() {
    if (panier.length === 0) {
      ajouterMessage(
        "Votre panier est encore vide 😊<br>" +
        "Dites-moi ce que vous souhaitez commander."
      );
      etape = "commande";
      return;
    }

    etape = "nom";

    ajouterMessage(
      "Parfait 👍 Votre commande est prête.<br><br>" +
      "Pour continuer, quel est votre <b>nom</b> ?"
    );
  }

  function traiterMessage(texte) {
    const t = normaliser(texte);
    const original = texte.trim();

    if (!original) return;

    // Nouvelle commande à n'importe quel moment
    if (estNouvelleCommande(original)) {
      commencerNouvelleCommande();
      return;
    }

    // Après une commande terminée, une nouvelle demande recommence automatiquement
    if (etape === "termine") {
      commencerNouvelleCommande();
      traiterMessage(original);
      return;
    }

    // Choix de taille
    if (etape === "taille") {
      if (
        t === "m" ||
        t.includes("taille m") ||
        t.includes("moyenne")
      ) {
        ajouterProduitAvecTaille("M");
        return;
      }

      if (
        t === "l" ||
        t.includes("taille l") ||
        t.includes("grande")
      ) {
        ajouterProduitAvecTaille("L");
        return;
      }

      ajouterMessage(
        "Veuillez choisir <b>M</b> ou <b>L</b> 😊"
      );
      return;
    }

    // Étape nom
    if (etape === "nom") {
      if (t.length < 2) {
        ajouterMessage("Pouvez-vous me donner votre nom ? 😊");
        return;
      }

      client.nom = original;
      etape = "telephone";

      ajouterMessage(
        `Merci <b>${client.nom}</b> 😊<br><br>` +
        "Quel est votre <b>numéro de téléphone</b> ?"
      );
      return;
    }

    // Étape téléphone
    if (etape === "telephone") {
      const chiffres = original.replace(/[^\d+]/g, "");

      if (chiffres.length < 8) {
        ajouterMessage(
          "Veuillez entrer un numéro de téléphone valide 📱"
        );
        return;
      }

      client.telephone = original;
      etape = "adresse";

      ajouterMessage(
        "Merci 📱<br><br>" +
        "Quelle est votre <b>adresse de livraison</b> ?"
      );
      return;
    }

    // Étape adresse
    if (etape === "adresse") {
      if (original.length < 5) {
        ajouterMessage(
          "Pouvez-vous préciser votre adresse de livraison ? 📍"
        );
        return;
      }

      client.adresse = original;
      etape = "confirmation";

      afficherCommande();

      ajouterMessage(
        "✅ Voici le récapitulatif de votre commande.<br><br>" +
        `Nom : <b>${client.nom}</b><br>` +
        `Téléphone : <b>${client.telephone}</b><br>` +
        `Adresse : <b>${client.adresse}</b><br><br>` +
        `<b>Confirmez-vous la commande ?</b><br><br>` +
        `👉 Répondez <b>Oui</b> pour confirmer<br>` +
        `👉 Répondez <b>Non</b> pour modifier`
      );

      return;
    }

    // Confirmation
    if (etape === "confirmation") {
      if (
        t === "oui" ||
        t === "yes" ||
        t === "confirme" ||
        t === "confirmer" ||
        t.includes("je confirme")
      ) {
        const message = creerMessageWhatsApp();

        ajouterMessage(
          "🎉 Merci ! Votre commande est confirmée.<br><br>" +
          "Je vais maintenant transmettre votre commande au restaurant. 🍣😊"
        );

        etape = "termine";

        setTimeout(() => {
          window.location.href =
            `https://wa.me/${whatsappRestaurant}?text=${message}`;
        }, 700);

        return;
      }

      if (
        t === "non" ||
        t.includes("modifier") ||
        t.includes("changer")
      ) {
        etape = "commande";

        ajouterMessage(
          "Pas de problème 😊<br><br>" +
          "Vous pouvez me dire ce que vous souhaitez modifier ou ajouter."
        );

        return;
      }

      ajouterMessage(
        "Souhaitez-vous confirmer la commande ? 😊<br><br>" +
        "Répondez simplement <b>Oui</b> ou <b>Non</b>."
      );

      return;
    }

    // Menu
    if (estDemandeMenu(original)) {
      afficherCategories();
      return;
    }

    // Catégories
    const categorie = chercherCategorie(original);

    if (categorie) {
      afficherCategorie(categorie);
      return;
    }

    // Ma commande
    if (
      t.includes("ma commande") ||
      t.includes("mon panier") ||
      t.includes("voir panier") ||
      t.includes("recapitulatif") ||
      t.includes("récapitulatif")
    ) {
      afficherCommande();

      if (panier.length > 0) {
        ajouterMessage(
          "Souhaitez-vous ajouter autre chose ou terminer la commande ? 😊"
        );
      }

      return;
    }

    // Terminer
    if (
      t === "c est tout" ||
      t === "c'est tout" ||
      t.includes("terminer") ||
      t.includes("finaliser") ||
      t.includes("je termine") ||
      t.includes("commander")
    ) {
      terminerCommande();
      return;
    }

    // Produit
    const produit = trouverProduitIntelligent(original);

    if (produit) {
      const quantite = trouverQuantite(original);

      if (produit.prixL) {
        demanderTaille(produit, quantite);
      } else {
        ajouterAuPanier(produit, quantite);
      }

      return;
    }

    // Cas où l'utilisateur répond "oui" dans une commande normale
    if (
      t === "oui" ||
      t === "ok" ||
      t === "daccord" ||
      t === "d'accord"
    ) {
      ajouterMessage(
        "Parfait 😊 Que souhaitez-vous ajouter à votre commande ?"
      );
      return;
    }

    // Fallback
    ajouterMessage(
      "Je n’ai pas bien compris 😅<br><br>" +
      "Vous pouvez par exemple écrire :<br>" +
      "🍣 <b>2 Maki Saumon</b><br>" +
      "🍜 <b>1 Pad thai</b><br>" +
      "🥤 <b>2 Soda</b><br>" +
      "📋 <b>Menu</b><br>" +
      "🛒 <b>Ma commande</b>"
    );
  }
function envoyer() {
  const input = document.getElementById("messageInput");

  if (!input) {
    alert("Erreur : champ de message introuvable.");
    return;
  }

  const texte = input.value.trim();

  if (!texte) {
    return;
  }

  ajouterMessage(texte, "user");
  input.value = "";

  traiterMessage(texte);
  }
  /* =========================================================
     INITIALISATION
  ========================================================= */

  ajouterMessage(
    "Bonjour et bienvenue chez <b>YONE</b> 🍣😊<br><br>" +
    "Je suis votre assistant de commande.<br>" +
    "Vous pouvez demander le <b>menu</b> ou commander directement.<br><br>" +
    "Que souhaitez-vous ?"
  );

  const champ = document.getElementById("messageInput");

  if (champ) {
    champ.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        envoyer();
      }
    });
  }
